<title id="t-restaurant-restroom-hero">A restaurant restroom: a dining table under a pendant lamp beside a run of stalls</title>
<desc id="d-restaurant-restroom-hero">Front view of a restaurant: a table for two with a wine glass and a covered plate under a pendant lamp, beside a run of three overhead braced bathroom stalls. The lamp is shown in orange.</desc>
