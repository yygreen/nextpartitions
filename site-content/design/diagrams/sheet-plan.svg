<title id="t-sheet-plan">Plan view of a row of toilet compartments</title>
<desc id="d-sheet-plan">Seen from above, after Bradley's example layout: an ADA compartment 60-1/2 inches wide with the toilet beside the dividing panel, grab bars and an outswing door at the wall end; an ambulatory compartment 36-1/2 inches wide with grab bars on both sides and an outswing door; two standard compartments 36 inches wide with inswing doors; 169 inches overall and 61-1/4 inches deep to the face.</desc>
