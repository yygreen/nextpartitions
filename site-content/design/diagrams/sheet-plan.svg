<title id="t-sheet-plan">Plan view of three toilet compartments</title>
<desc id="d-sheet-plan">Seen from above: an accessible compartment 60 inches wide with grab bars and an outswing door at least 32 inches clear, an ambulatory compartment 35 to 37 inches wide with grab bars on both sides, and a standard compartment at least 30 inches wide with an inswing door. All are at least 60 inches deep.</desc>
