<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 546" width="390" height="546" role="img" aria-labelledby="t-measure-new-restroom d-measure-new-restroom" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-measure-new-restroom">How to measure an empty restroom for new partitions</title>
<desc id="d-measure-new-restroom">Seen from above, an empty restroom: A, the width of the wall the stalls will run along; B, the room depth; D, where the entry door is and which way it swings; E, each toilet flange centerline measured from the side wall. A section shows C, the ceiling height, and F, what the floor and the structure above the ceiling are made of.</desc>
