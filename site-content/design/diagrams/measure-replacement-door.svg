<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-labelledby="t-measure-replacement-door d-measure-replacement-door" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-measure-replacement-door">How to measure a bathroom stall door for a replacement</title>
<desc id="d-measure-replacement-door">Measure A, the door width; B, the door height; C, the opening between the pilasters; D, the gap from the floor to the bottom of the door; E, the door thickness; and F, whether the door swings in or out and which side the hinge is on, seen from outside the stall.</desc>
<defs>
<pattern id="hatch-measure-replacement-door" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f2f0ec"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc7bc" stroke-width="1.5"/></pattern>
<marker id="tick-measure-replacement-door" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 8 L8 2" stroke="#7a6a5e" stroke-width="1.5"/></marker>
</defs>
<rect width="780" height="400" fill="#ffffff"/>
<rect x="40" y="30" width="26" height="300" fill="#ffffff" stroke="#1c0e05" stroke-width="1.5"/><rect x="256" y="30" width="26" height="300" fill="#ffffff" stroke="#1c0e05" stroke-width="1.5"/><rect x="74" y="60" width="174" height="230" fill="#ffffff" stroke="#1c0e05" stroke-width="1.5"/><rect x="74" y="60" width="174" height="230" fill="none" stroke="#fe7802" stroke-width="2.5"/><line x1="20" y1="330" x2="300" y2="330" stroke="#1c0e05" stroke-width="1.5"/><rect x="20" y="330" width="280" height="18" fill="url(#hatch-measure-replacement-door)" stroke="none" stroke-width="1.5"/><line x1="74" y1="22" x2="248" y2="22" stroke="#7a6a5e" stroke-width="1"/><line x1="74" y1="17" x2="74" y2="27" stroke="#7a6a5e" stroke-width="1"/><line x1="248" y1="17" x2="248" y2="27" stroke="#7a6a5e" stroke-width="1"/><text x="161" y="15" font-size="14" font-weight="600" fill="#7a6a5e" text-anchor="middle">A  door width</text><line x1="292" y1="60" x2="292" y2="290" stroke="#7a6a5e" stroke-width="1"/><line x1="287" y1="60" x2="297" y2="60" stroke="#7a6a5e" stroke-width="1"/><line x1="287" y1="290" x2="297" y2="290" stroke="#7a6a5e" stroke-width="1"/><text x="300" y="180" font-size="14" font-weight="600" fill="#7a6a5e" text-anchor="start">B  door height</text><line x1="66" y1="384" x2="256" y2="384" stroke="#7a6a5e" stroke-width="1"/><line x1="66" y1="379" x2="66" y2="389" stroke="#7a6a5e" stroke-width="1"/><line x1="256" y1="379" x2="256" y2="389" stroke="#7a6a5e" stroke-width="1"/><text x="161" y="377" font-size="14" font-weight="600" fill="#7a6a5e" text-anchor="middle">C  opening between pilasters</text><line x1="28" y1="290" x2="28" y2="330" stroke="#7a6a5e" stroke-width="1"/><line x1="23" y1="290" x2="33" y2="290" stroke="#7a6a5e" stroke-width="1"/><line x1="23" y1="330" x2="33" y2="330" stroke="#7a6a5e" stroke-width="1"/><text x="20" y="315" font-size="14" font-weight="600" fill="#7a6a5e" text-anchor="end">D</text><text x="520" y="46" font-size="15" font-weight="700" fill="#1c0e05" text-anchor="middle">Edge view</text><rect x="512" y="60" width="18" height="230" fill="#fe7802" stroke="#fe7802" stroke-width="1.5"/><line x1="512" y1="318" x2="530" y2="318" stroke="#7a6a5e" stroke-width="1"/><line x1="512" y1="313" x2="512" y2="323" stroke="#7a6a5e" stroke-width="1"/><line x1="530" y1="313" x2="530" y2="323" stroke="#7a6a5e" stroke-width="1"/><text x="521" y="311" font-size="14" font-weight="600" fill="#7a6a5e" text-anchor="middle">E  thickness</text><text x="650" y="46" font-size="15" font-weight="700" fill="#1c0e05" text-anchor="middle">From outside the stall</text><rect x="570" y="150" width="22" height="22" fill="#ffffff" stroke="#1c0e05" stroke-width="1.5"/><rect x="710" y="150" width="22" height="22" fill="#ffffff" stroke="#1c0e05" stroke-width="1.5"/><line x1="592" y1="161" x2="710" y2="161" stroke="#fe7802" stroke-width="4"/><path d="M592 161 A118 118 0 0 1 710 279" fill="none" stroke="#7a6a5e" stroke-dasharray="5 5" stroke-width="1.5"/><line x1="592" y1="161" x2="592" y2="279" stroke="#fe7802" stroke-width="2" stroke-dasharray="6 4"/><text x="652" y="300" font-size="14" font-weight="600" fill="#7a6a5e" text-anchor="middle">F  inswing or outswing,</text><text x="652" y="318" font-size="14" font-weight="600" fill="#7a6a5e" text-anchor="middle">hinge on the left or right</text><text x="650" y="130" font-size="13" font-weight="500" fill="#7a6a5e" text-anchor="middle">stall inside ↓</text>
</svg>
