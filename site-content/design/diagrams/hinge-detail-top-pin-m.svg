<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 224" width="360" height="224" role="img" aria-labelledby="t-hinge-detail-top-pin-m d-hinge-detail-top-pin-m" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-hinge-detail-top-pin-m">Detail: top of a gravity hinge</title>
<desc id="d-hinge-detail-top-pin-m">Front view of the top of a gravity (cam) hinge, the door cut away at the hinge. The hinge pin goes in from above, through the door's hinge and the top hinge bracket on the pilaster, turns in a nylon bushing, and sits flush with the top of the door. The next door's edge shows on the other side of the pilaster.</desc>
