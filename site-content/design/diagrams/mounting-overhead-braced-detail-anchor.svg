<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 300" width="410" height="300" role="img" aria-labelledby="t-mounting-overhead-braced-detail-anchor d-mounting-overhead-braced-detail-anchor" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-mounting-overhead-braced-detail-anchor">Detail: anchor</title>
<desc id="d-mounting-overhead-braced-detail-anchor">The pilaster foot, after Bobrick's floor anchor: a leveling bar bolted under the stile, threaded rods with nuts and washers, a shoe retainer and wedge anchors at least 2 inches into structural concrete at least 3 inches thick, all covered by a 4-inch stainless steel shoe.</desc>
