<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" role="img" aria-labelledby="t-material-section-powder-coated-steel-m d-material-section-powder-coated-steel-m" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-material-section-powder-coated-steel-m">Powder coated steel partition door, edge view</title>
<desc id="d-material-section-powder-coated-steel-m">A powder coated steel door cut through near its edge: two galvannealed steel face sheets, each with a powder coat on the outside, over a honeycomb core. The edge is a formed steel molding that interlocks with the turned-in ends of both face sheets. 1 inch thick.</desc>
