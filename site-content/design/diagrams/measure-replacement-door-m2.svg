<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img" aria-labelledby="t-measure-replacement-door-m2 d-measure-replacement-door-m2" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-measure-replacement-door-m2">How to measure a bathroom stall door for a replacement</title>
<desc id="d-measure-replacement-door-m2">Measure A, the door width; B, the door height; C, the opening between the pilasters; D, the gap from the floor to the bottom of the door; E, the door thickness; and F, whether the door swings in or out and which side the hinge is on, seen from outside the stall.</desc>
<defs>
<pattern id="hatch-measure-replacement-door-m2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f2f0ec"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc7bc" stroke-width="1.5"/></pattern>
<marker id="tick-measure-replacement-door-m2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 8 L8 2" stroke="#7a6a5e" stroke-width="1.5"/></marker>
</defs>
<rect width="360" height="220" fill="#ffffff"/>
<text x="70" y="26" font-size="14" font-weight="700" fill="#1c0e05" text-anchor="middle">Edge view</text><rect x="64" y="42" width="12" height="136" fill="#fe7802" stroke="#fe7802" stroke-width="1.5"/><line x1="64" y1="204" x2="76" y2="204" stroke="#7a6a5e" stroke-width="1"/><line x1="64" y1="199" x2="64" y2="209" stroke="#7a6a5e" stroke-width="1"/><line x1="76" y1="199" x2="76" y2="209" stroke="#7a6a5e" stroke-width="1"/><text x="70" y="197" font-size="13" font-weight="600" fill="#7a6a5e" text-anchor="middle">E</text><text x="255" y="26" font-size="14" font-weight="700" fill="#1c0e05" text-anchor="middle">From outside the stall</text><rect x="178" y="68" width="16" height="16" fill="#ffffff" stroke="#1c0e05" stroke-width="1.5"/><rect x="304" y="68" width="16" height="16" fill="#ffffff" stroke="#1c0e05" stroke-width="1.5"/><line x1="194" y1="76" x2="304" y2="76" stroke="#fe7802" stroke-width="3.5"/><path d="M194 76 A110 110 0 0 1 304 186" fill="none" stroke="#7a6a5e" stroke-dasharray="5 5" stroke-width="1.5"/><line x1="194" y1="76" x2="194" y2="186" stroke="#fe7802" stroke-width="2" stroke-dasharray="6 4"/><text x="249" y="56" font-size="13" font-weight="500" fill="#7a6a5e" text-anchor="middle">stall inside ↓</text><text x="232" y="150" font-size="14" font-weight="700" fill="#7a6a5e" text-anchor="middle">F</text>
</svg>
