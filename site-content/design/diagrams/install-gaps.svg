<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 447.2" width="780" height="447.2" role="img" aria-labelledby="t-install-gaps d-install-gaps" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-install-gaps">Gaps set when toilet partition doors and panels go in</title>
<desc id="d-install-gaps">Front view of a door between a wall pilaster and a middle pilaster, and side view of a panel between its pilaster and the back wall. The gaps are shown in orange: 1/8 inch between the door and the pilaster on the hinge side and on the latch side, 1/2 to 1-1/4 inch between a wall pilaster and the wall, 1 inch between the panel and the back wall and 1/2 inch between the panel and the pilaster. The door and the panel rest on a 12-inch spacer while they are fixed.</desc>
<defs>
<pattern id="hatch-install-gaps" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f2f0ec"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc7bc" stroke-width="1.5"/></pattern>
<marker id="tick-install-gaps" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 8 L8 2" stroke="#7a6a5e" stroke-width="1.5"/></marker>
</defs>
<rect width="780" height="447.2" fill="#ffffff"/>
