<title id="t-wall-backing">Wall backing behind a toilet partition wall bracket</title>
<desc id="d-wall-backing">The wall cut through at a panel bracket, seen from above: the wall finish, solid backing behind it (in orange), and a bracket fixed with a screw into a plastic anchor in a 5/16-inch hole at least 2 inches deep at each ear. The panel sits in the bracket.</desc>
