<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 304" width="390" height="304" role="img" aria-labelledby="t-material-section-phenolic d-material-section-phenolic" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-material-section-phenolic">Phenolic (compact laminate) partition door, edge view</title>
<desc id="d-material-section-phenolic">A phenolic (compact laminate) door cut through near its edge: layers of resin-impregnated kraft paper fused into one solid core, with decorative melamine faces. The core is black, or matches the face color on color-through lines. Doors are 3/4 inch thick (Bobrick, Bradley).</desc>
