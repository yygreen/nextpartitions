<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 299.79999999999995" width="780" height="299.79999999999995" role="img" aria-labelledby="t-ada-toe-clearance d-ada-toe-clearance" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-ada-toe-clearance">Toe clearance under the partitions of a wheelchair accessible compartment</title>
<desc id="d-ada-toe-clearance">Three views of a wheelchair accessible compartment. The front partition seen from the front, and the side partition seen from inside the compartment: the doors and panels stop at least 9 inches above the floor, so feet and wheelchair footrests can pass under them. The toe space is shown in orange; pilasters and their shoes may stand in it. A section through either partition shows the toe space 9 inches high minimum and 6 inches deep minimum beyond the compartment-side face of the partition.</desc>
