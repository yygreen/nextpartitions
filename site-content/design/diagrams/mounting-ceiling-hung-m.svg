<title id="t-mounting-ceiling-hung-m">Ceiling hung toilet partitions, front view</title>
<desc id="d-mounting-ceiling-hung-m">Two stalls seen from the front. Pilasters hang from structural steel above the finished ceiling and stop short of the floor, which stays completely clear. Ceiling-hung pilasters are 83 inches for an 8-foot ceiling.</desc>
