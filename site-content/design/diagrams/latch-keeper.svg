<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="t-latch-keeper d-latch-keeper" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-latch-keeper">Bathroom stall latch and keeper</title>
<desc id="d-latch-keeper">Inside face of a stall door where it meets the pilaster. The latch is mounted on the door; its bolt slides into the keeper (strike) mounted on the pilaster. An indicator latch adds a visible occupied or vacant indicator.</desc>
<defs>
<pattern id="hatch-latch-keeper" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f2f0ec"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc7bc" stroke-width="1.5"/></pattern>
<marker id="tick-latch-keeper" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 8 L8 2" stroke="#7a6a5e" stroke-width="1.5"/></marker>
</defs>
<rect width="640" height="320" fill="#ffffff"/>
<rect x="60" y="40" width="120" height="220" fill="#ffffff" stroke="#1c0e05" stroke-width="1.5"/><rect x="186" y="20" width="34" height="260" fill="#ffffff" stroke="#1c0e05" stroke-width="1.5"/><rect x="132" y="132" width="48" height="22" fill="#fe7802" stroke="#fe7802" stroke-width="1.5" rx="3"/><rect x="168" y="138" width="30" height="10" fill="#1c0e05" stroke="none" stroke-width="1.5"/><rect x="190" y="126" width="22" height="34" fill="#ffffff" stroke="#fe7802" stroke-width="2.5"/><text x="140" y="300" font-size="16" font-weight="700" fill="#1c0e05" text-anchor="middle">Slide latch</text><rect x="380" y="40" width="120" height="220" fill="#ffffff" stroke="#1c0e05" stroke-width="1.5"/><rect x="506" y="20" width="34" height="260" fill="#ffffff" stroke="#1c0e05" stroke-width="1.5"/><rect x="452" y="132" width="48" height="22" fill="#fe7802" stroke="#fe7802" stroke-width="1.5" rx="3"/><rect x="488" y="138" width="30" height="10" fill="#1c0e05" stroke="none" stroke-width="1.5"/><rect x="510" y="126" width="22" height="34" fill="#ffffff" stroke="#fe7802" stroke-width="2.5"/><rect x="400" y="126" width="34" height="34" fill="#ffffff" stroke="#fe7802" stroke-width="2.5" rx="17"/><text x="417" y="148" font-size="14" font-weight="500" fill="#fe7802" text-anchor="middle">●</text><text x="460" y="300" font-size="16" font-weight="700" fill="#1c0e05" text-anchor="middle">Indicator latch</text><g class="co"><line x1="150" y1="100" x2="150" y2="132" stroke="#fe7802" stroke-width="1.5"/><circle cx="150" cy="132" r="2.5" fill="#fe7802"/><circle cx="150" cy="100" r="12" fill="#fe7802"/><text x="150" y="105" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text></g><g class="co"><line x1="240" y1="143" x2="212" y2="143" stroke="#fe7802" stroke-width="1.5"/><circle cx="212" cy="143" r="2.5" fill="#fe7802"/><circle cx="240" cy="143" r="12" fill="#fe7802"/><text x="240" y="148" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text></g><g class="co"><line x1="417" y1="100" x2="417" y2="126" stroke="#fe7802" stroke-width="1.5"/><circle cx="417" cy="126" r="2.5" fill="#fe7802"/><circle cx="417" cy="100" r="12" fill="#fe7802"/><text x="417" y="105" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text></g><text x="120" y="30" font-size="13" font-weight="500" fill="#7a6a5e" text-anchor="middle">door</text><text x="203" y="14" font-size="13" font-weight="500" fill="#7a6a5e" text-anchor="middle">pilaster</text>
