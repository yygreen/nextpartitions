<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 213" width="360" height="213" role="img" aria-labelledby="t-install-gaps-m d-install-gaps-m" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-install-gaps-m">Gaps set when toilet partition doors and panels go in</title>
<desc id="d-install-gaps-m">Front view of a door between a wall pilaster and a middle pilaster, and side view of a panel between its pilaster and the back wall. The gaps are shown in orange: 1/8 inch between the door and the pilaster on the hinge side and on the latch side, 1/2 to 1-1/4 inch between a wall pilaster and the wall, 1 inch between the panel and the back wall and 1/2 inch between the panel and the pilaster. The door and the panel rest on a 12-inch spacer while they are fixed.</desc>
