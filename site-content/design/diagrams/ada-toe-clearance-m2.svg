<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 182" width="360" height="182" role="img" aria-labelledby="t-ada-toe-clearance-m2 d-ada-toe-clearance-m2" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-ada-toe-clearance-m2">Toe clearance under the partitions of a wheelchair accessible compartment</title>
<desc id="d-ada-toe-clearance-m2">Three views of a wheelchair accessible compartment. The front partition seen from the front, and the side partition seen from inside the compartment: the doors and panels stop at least 9 inches above the floor, so feet and wheelchair footrests can pass under them. The toe space is shown in orange; pilasters and their shoes may stand in it. A section through either partition shows the toe space 9 inches high minimum and 6 inches deep minimum beyond the compartment-side face of the partition.</desc>
<defs>
<pattern id="hatch-ada-toe-clearance-m2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f2f0ec"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc7bc" stroke-width="1.5"/></pattern>
<marker id="tick-ada-toe-clearance-m2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 8 L8 2" stroke="#7a6a5e" stroke-width="1.5"/></marker>
</defs>
<rect width="360" height="182" fill="#ffffff"/>
