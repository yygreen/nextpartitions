<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 222" width="360" height="222" role="img" aria-labelledby="t-material-sections-compare-m d-material-sections-compare-m" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-material-sections-compare-m">Partition materials compared, edge view</title>
<desc id="d-material-sections-compare-m">Five partition doors side by side, each cut through and seen edge on at the same scale: phenolic 3/4 inch, layered kraft paper core with melamine faces and a machined, chamfered edge; solid plastic (HDPE) 1 inch, one solid sheet with a rounded edge; plastic laminate 1 inch, particleboard core with laminate on the faces and the edge; powder coated steel and stainless steel 1 inch, steel faces over a honeycomb core joined by a formed, interlocking edge molding.</desc>
