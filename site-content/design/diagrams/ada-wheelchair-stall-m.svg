<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 237" width="360" height="237" role="img" aria-labelledby="t-ada-wheelchair-stall-m d-ada-wheelchair-stall-m" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-ada-wheelchair-stall-m">Wheelchair accessible toilet compartment with grab bars, plan view</title>
<desc id="d-ada-wheelchair-stall-m">A wheelchair accessible compartment seen from above, drawn at the minimum size: 60 inches wide minimum, and 59 inches deep minimum with a floor-mounted toilet or 56 inches with a wall-hung toilet. The toilet centerline is 16 to 18 inches from the side wall. The side wall grab bar is 42 inches long minimum, starts 12 inches maximum from the rear wall and reaches 54 inches minimum from it. The rear wall grab bar is 36 inches long minimum. The door in the front partition gives a 32-inch minimum clear opening, sits within 4 inches of the side partition farthest from the toilet and swings out, clear of the minimum compartment area. The minimum area and the grab bars are shown in orange.</desc>
