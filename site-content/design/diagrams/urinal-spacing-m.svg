<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 195" width="360" height="195" role="img" aria-labelledby="t-urinal-spacing-m d-urinal-spacing-m" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-urinal-spacing-m">Urinal spacing with urinal screens, plan view</title>
<desc id="d-urinal-spacing-m">Seen from above: three wall-hung urinals along a wall, with a side wall on the left and urinal screens between them. The first urinal centerline is at least 15 inches from the side wall, urinal centerlines are at least 30 inches apart, and there is at least 21 inches of clear space in front of each urinal (International Plumbing Code 405.3.1).</desc>
<defs>
