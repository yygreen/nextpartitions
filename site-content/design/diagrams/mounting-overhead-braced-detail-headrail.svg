<title id="t-mounting-overhead-braced-detail-headrail">Detail: headrail</title>
<desc id="d-mounting-overhead-braced-detail-headrail">The headrail, after Bobrick's headrail detail: an extruded anodized aluminum rail with a sloping top and a raised grip-resistant face edge, on top of the stile and fixed to the wall with a wall bracket.</desc>
