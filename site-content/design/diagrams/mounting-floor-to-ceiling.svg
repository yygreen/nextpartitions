<title id="t-mounting-floor-to-ceiling">Floor to ceiling toilet partitions, front view</title>
<desc id="d-mounting-floor-to-ceiling">Two stalls seen from the front. Pilasters are anchored into the floor and into structure at the ceiling. The doors and panels stay standard height with the usual floor gap; only the pilasters run floor to ceiling.</desc>
