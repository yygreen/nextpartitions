<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 308" width="780" height="308" role="img" aria-labelledby="t-install-layout-marks d-install-layout-marks" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-install-layout-marks">Layout marks for toilet partition wall brackets</title>
<desc id="d-install-layout-marks">The side wall and back wall of a restroom corner, unfolded flat, with a plumb line at the pilaster centerline on the side wall and at each panel centerline on the back wall. Bracket marks sit on every plumb line 19 and 63 inches above the highest point of the floor; a third bracket option adds a mark at 43 inches, and continuous brackets use one mark at 12-1/2 inches. A small plan shows the same corner from above with the pilaster line on the floor.</desc>
