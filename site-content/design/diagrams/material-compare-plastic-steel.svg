<title id="t-material-compare-plastic-steel">Plastic and steel partition doors compared, edge view</title>
<desc id="d-material-compare-plastic-steel">Three partition doors cut through and seen edge on at the same scale: solid plastic (HDPE), one solid 1 inch sheet; powder coated steel and stainless steel, 1 inch, steel faces over a honeycomb core with a formed edge molding.</desc>
