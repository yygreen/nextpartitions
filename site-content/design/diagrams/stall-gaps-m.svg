<title id="t-stall-gaps-m">The four gaps in a standard bathroom stall</title>
<desc id="d-stall-gaps-m">Front view of standard stalls with the four gaps marked: the vertical gaps at the door edges, the space under the doors and panels (12 inches), the space above them, and the gap where the partition meets the wall.</desc>
