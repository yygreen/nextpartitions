<title id="t-mounting-floor-mounted">Floor mounted (floor anchored) toilet partitions, front view</title>
<desc id="d-mounting-floor-mounted">Two stalls seen from the front. There is no headrail: pilasters are anchored into the structural concrete floor, which carries the whole load. Floor-anchored pilasters are 69 inches high.</desc>
