<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" role="img" aria-labelledby="t-hinge-detail-cam d-hinge-detail-cam" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-hinge-detail-cam">Detail: bottom of a gravity hinge</title>
<desc id="d-hinge-detail-cam">Front view of the bottom of a gravity (cam) hinge, the door cut away at the hinge. A box cam in the door rests on the cam pintle of the bottom hinge bracket, which is fixed to the pilaster. The locking nut under the bracket is the adjusting point: loosen it, set the door to its rest position and tighten it again.</desc>
<defs>
<pattern id="hatch-hinge-detail-cam" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f2f0ec"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc7bc" stroke-width="1.5"/></pattern>
<marker id="tick-hinge-detail-cam" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 8 L8 2" stroke="#7a6a5e" stroke-width="1.5"/></marker>
</defs>
<rect width="400" height="250" fill="#ffffff"/>
<g transform="translate(118 125) scale(0.8833) translate(-150 -145)"><clipPath id="c-hinge-detail-cam"><circle cx="150" cy="145" r="120"/></clipPath><g clip-path="url(#c-hinge-detail-cam)"><rect x="20" y="-10" width="88" height="330" fill="#ffffff" stroke="#1c0e05" stroke-width="1.5"/><rect x="128" y="-10" width="210" height="160" fill="#ffffff" stroke="#1c0e05" stroke-width="1.5"/><rect x="128" y="98" width="64" height="52" fill="#ffffff" stroke="#1c0e05" stroke-width="1.2" stroke-dasharray="5 3"/><path d="M138 106 H176 V150 H168 V140 L157 130 L146 140 V150 H138 Z" fill="#fe7802"/><path d="M146 168 V140 L157 130 L168 140 V168 Z" fill="#fff" stroke="#1c0e05" stroke-width="1.5" stroke-linejoin="round"/><rect x="84" y="140" width="24" height="62" fill="#ffffff" stroke="#1c0e05" stroke-width="1.5"/><rect x="108" y="168" width="74" height="18" fill="#ffffff" stroke="#1c0e05" stroke-width="1.5"/><circle cx="96" cy="156" r="4.5" fill="#fff" stroke="#1c0e05" stroke-width="1.2"/><circle cx="96" cy="186" r="4.5" fill="#fff" stroke="#1c0e05" stroke-width="1.2"/><rect x="146" y="186" width="22" height="11" fill="#fff1e5" stroke="#fe7802" stroke-width="2"/><rect x="151" y="197" width="12" height="12" fill="#ffffff" stroke="#1c0e05" stroke-width="1.2"/><line x1="157" y1="199" x2="157" y2="208" stroke="#1c0e05" stroke-width="2"/><text x="75" y="100" font-size="14" font-weight="500" fill="#7a6a5e" text-anchor="middle">pilaster</text></g></g><circle cx="118" cy="125" r="106" fill="none" stroke="#1c0e05" stroke-width="1.5"/><path d="M242 21 H232 L178.1 53.5" fill="none" stroke="#fe7802" stroke-width="1.2" stroke-linejoin="round"/><circle cx="178.1" cy="53.5" r="2.5" fill="#fe7802"/><text x="246" y="26" font-size="14" font-weight="500" fill="#1c0e05" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">door</text><path d="M242 53 H232 L141 101.2" fill="none" stroke="#fe7802" stroke-width="1.2" stroke-linejoin="round"/><circle cx="141" cy="101.2" r="2.5" fill="#fe7802"/><text x="246" y="58" font-size="14" font-weight="500" fill="#1c0e05" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">box cam</text><path d="M242 85 H232 L133.9 136.5" fill="none" stroke="#fe7802" stroke-width="1.2" stroke-linejoin="round"/><circle cx="133.9" cy="136.5" r="2.5" fill="#fe7802"/><text x="246" y="90" font-size="14" font-weight="500" fill="#1c0e05" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">cam pintle</text><path d="M242 117 H232 L146.3 153.3" fill="none" stroke="#fe7802" stroke-width="1.2" stroke-linejoin="round"/><circle cx="146.3" cy="153.3" r="2.5" fill="#fe7802"/><text x="246" y="122" font-size="14" font-weight="500" fill="#1c0e05" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">bottom hinge</text><text x="246" y="138" font-size="14" font-weight="500" fill="#1c0e05" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">bracket</text><path d="M242 165 H232 L133.9 165.6" fill="none" stroke="#fe7802" stroke-width="1.2" stroke-linejoin="round"/><circle cx="133.9" cy="165.6" r="2.5" fill="#fe7802"/><text x="246" y="170" font-size="14" font-weight="500" fill="#1c0e05" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">locking nut, the</text><text x="246" y="186" font-size="14" font-weight="500" fill="#1c0e05" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">adjusting point</text><text x="246" y="218" font-size="13" font-weight="500" fill="#7a6a5e" text-anchor="start">front view, door</text><text x="246" y="234" font-size="13" font-weight="500" fill="#7a6a5e" text-anchor="start">cut away at the cam</text>
</svg>
