<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 171" width="360" height="171" role="img" aria-labelledby="t-bracket-types-m1 d-bracket-types-m1" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-bracket-types-m1">Toilet partition bracket types</title>
<desc id="d-bracket-types-m1">Four partition brackets, each as seen facing the wall and from above: 1, a stirrup bracket with one ear; 2, a stirrup bracket with two ears; 3, a continuous ear bracket; 4, a continuous U-bracket. Openings of 3/4 inch hold pilasters and openings of 1/2 inch hold panels.</desc>
