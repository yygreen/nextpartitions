<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 301.6" width="780" height="301.6" role="img" aria-labelledby="t-ada-ambulatory-stall d-ada-ambulatory-stall" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-ada-ambulatory-stall">Ambulatory accessible toilet compartment, plan view</title>
<desc id="d-ada-ambulatory-stall">An ambulatory accessible compartment seen from above: 35 to 37 inches wide and 60 inches deep minimum, with the toilet centerline 17 to 19 inches from the side wall or partition. A side-wall grab bar 42 inches long minimum is on both sides, starting 12 inches maximum from the rear wall and reaching 54 inches minimum from it. The door gives a 32-inch minimum clear opening and swings out, clear of the minimum compartment area. The minimum area and the grab bars are shown in orange.</desc>
