<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 208" width="360" height="208" role="img" aria-labelledby="t-door-latch-problems-m1 d-door-latch-problems-m1" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-door-latch-problems-m1">Why a toilet partition door won't latch: three causes</title>
<desc id="d-door-latch-problems-m1">Three front views of a stall door between its hinge pilaster and latch pilaster: A, the latch pilaster leans out of plumb, so the gap at the latch edge widens towards the top; B, the door has dropped at the latch side, so its top edge slopes and the latch sits below the keeper; C, the door hangs square but the keeper on the pilaster is out of line with the latch. What is out of line is shown in orange.</desc>
