<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 222" width="360" height="222" role="img" aria-labelledby="t-install-sequence-1-m1 d-install-sequence-1-m1" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-install-sequence-1-m1">Toilet partition installation sequence, steps 1 to 4</title>
<desc id="d-install-sequence-1-m1">Four small frames, each a plan seen from above over a front view of two stalls: 1, the layout marked on the floor and walls; 2, wall brackets fixed at the marks; 3, the wall pilasters stood in their shoes and leveled; 4, the panel set into its wall brackets on a 12-inch spacer, with the middle pilaster to follow. Each step is shown in orange.</desc>
