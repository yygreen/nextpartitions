<title id="t-mounting-overhead-braced">Overhead braced toilet partitions, front view</title>
<desc id="d-mounting-overhead-braced">Two stalls seen from the front. Pilasters stand on the floor in shoes; an aluminum headrail runs across their tops and fastens to both walls. Doors are 58 inches high, 12 inches above the floor; pilasters are 83 inches.</desc>
