<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" role="img" aria-labelledby="t-mounting-ceiling-hung-detail-hanger d-mounting-ceiling-hung-detail-hanger" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-mounting-ceiling-hung-detail-hanger">Detail: hanger</title>
<desc id="d-mounting-ceiling-hung-detail-hanger">The top of a ceiling-hung stile, after Bobrick's ceiling leveling device: a threaded rod from a structural I-beam above the ceiling (not supplied by the partition maker) through a bevel washer and a spacer in the finished ceiling, into a leveling bar in the stile.</desc>
