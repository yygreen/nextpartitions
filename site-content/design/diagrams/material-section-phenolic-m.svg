<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 175" width="360" height="175" role="img" aria-labelledby="t-material-section-phenolic-m d-material-section-phenolic-m" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-material-section-phenolic-m">Phenolic (compact laminate) partition door, edge view</title>
<desc id="d-material-section-phenolic-m">A phenolic (compact laminate) door cut through near its edge: layers of resin-impregnated kraft paper fused into one solid core, with decorative melamine faces. The edge is the fused sheet itself, machined smooth with a small chamfer on both corners; it is black, or matches the face color on color-through lines. Doors are 3/4 inch thick.</desc>
