<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 236" width="780" height="236" role="img" aria-labelledby="t-accessible-stall-heights d-accessible-stall-heights" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-accessible-stall-heights">Heights in a wheelchair accessible toilet compartment</title>
<desc id="d-accessible-stall-heights">Three elevations of a wheelchair accessible compartment. The rear wall: a grab bar 36 inches long minimum, reaching 12 inches minimum on one side of the toilet centerline and 24 inches minimum on the other, with the centerline 16 to 18 inches from the side wall and the seat 17 to 19 inches high. The side wall closest to the toilet: a grab bar 42 inches long minimum, starting 12 inches maximum from the rear wall and reaching 54 inches minimum from it, and a toilet paper dispenser 7 to 9 inches in front of the toilet with its outlet 15 inches minimum above the floor. Both grab bars, shown in orange, are 33 to 36 inches high to the top. The inside of the door: latch and pulls 34 to 48 inches above the floor, and a coat hook within 15 to 48 inches.</desc>
