<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 186" width="360" height="186" role="img" aria-labelledby="t-accessible-stall-heights-m1 d-accessible-stall-heights-m1" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-accessible-stall-heights-m1">Heights in a wheelchair accessible toilet compartment</title>
<desc id="d-accessible-stall-heights-m1">Three elevations of a wheelchair accessible compartment. The rear wall: a grab bar 36 inches long minimum, reaching 12 inches minimum on one side of the toilet centerline and 24 inches minimum on the other, with the centerline 16 to 18 inches from the side wall and the seat 17 to 19 inches high. The side wall closest to the toilet: a grab bar 42 inches long minimum, starting 12 inches maximum from the rear wall and reaching 54 inches minimum from it, and a toilet paper dispenser 7 to 9 inches in front of the toilet with its outlet 15 inches minimum above the floor. Both grab bars, shown in orange, are 33 to 36 inches high to the top. The inside of the door: latch and pulls 34 to 48 inches above the floor, and a coat hook within 15 to 48 inches.</desc>
<defs>
<pattern id="hatch-accessible-stall-heights-m1" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f2f0ec"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc7bc" stroke-width="1.5"/></pattern>
<marker id="tick-accessible-stall-heights-m1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 8 L8 2" stroke="#7a6a5e" stroke-width="1.5"/></marker>
</defs>
