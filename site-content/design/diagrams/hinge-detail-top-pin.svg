<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" role="img" aria-labelledby="t-hinge-detail-top-pin d-hinge-detail-top-pin" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-hinge-detail-top-pin">Detail: top of a gravity hinge</title>
<desc id="d-hinge-detail-top-pin">Front view of the top of a gravity (cam) hinge, the door cut away at the hinge. The hinge pin goes in from above, through the door's hinge and the top hinge bracket on the pilaster, turns in a nylon bushing, and sits flush with the top of the door.</desc>
