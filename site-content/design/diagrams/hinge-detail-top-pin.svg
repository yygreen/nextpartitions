<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" role="img" aria-labelledby="t-hinge-detail-top-pin d-hinge-detail-top-pin" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-hinge-detail-top-pin">Detail: top of a gravity hinge</title>
<desc id="d-hinge-detail-top-pin">Front view of the top of a gravity (cam) hinge, the door cut away at the hinge. The hinge pin goes in from above, through the door's hinge and the top hinge bracket on the pilaster, turns in a nylon bushing, and sits flush with the top of the door. The next door's edge shows on the other side of the pilaster.</desc>
<defs>
<pattern id="hatch-hinge-detail-top-pin" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f2f0ec"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc7bc" stroke-width="1.5"/></pattern>
<marker id="tick-hinge-detail-top-pin" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 8 L8 2" stroke="#7a6a5e" stroke-width="1.5"/></marker>
</defs>
<rect width="780" height="420" fill="#ffffff"/>
