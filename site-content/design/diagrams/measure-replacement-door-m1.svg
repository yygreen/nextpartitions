<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 226" width="360" height="226" role="img" aria-labelledby="t-measure-replacement-door-m1 d-measure-replacement-door-m1" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-measure-replacement-door-m1">How to measure a bathroom stall door for a replacement</title>
<desc id="d-measure-replacement-door-m1">Measure A, the door width; B, the door height; C, the opening between the pilasters; D, the gap from the floor to the bottom of the door; E, the door thickness; and F, whether the door swings in or out and which side the hinge is on, seen from outside the stall.</desc>
<defs>
<pattern id="hatch-measure-replacement-door-m1" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f2f0ec"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc7bc" stroke-width="1.5"/></pattern>
<marker id="tick-measure-replacement-door-m1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 8 L8 2" stroke="#7a6a5e" stroke-width="1.5"/></marker>
</defs>
<rect width="360" height="226" fill="#ffffff"/>
