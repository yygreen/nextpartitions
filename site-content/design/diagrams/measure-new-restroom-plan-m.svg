<title id="t-measure-new-restroom-plan-m">How to measure an empty restroom for new partitions, plan</title>
<desc id="d-measure-new-restroom-plan-m">Seen from above, an empty restroom: A, the width of the wall the stalls will run along (in orange); B, the room depth; D, where the entry door is, measured from the nearest corner, and which way it swings; E, each toilet flange centerline measured from the side wall.</desc>
