<title id="t-mounting-floor-mounted-detail-anchor-m">Detail: pilaster foot and floor anchor</title>
<desc id="d-mounting-floor-mounted-detail-anchor-m">The pilaster foot: a leveling bar bolted under the stile, threaded rods with nuts and washers, a shoe retainer and wedge anchors at least 2 inches into structural concrete at least 3 inches thick, all covered by a 4-inch stainless steel shoe. The next pilaster's foot shows beside it.</desc>
