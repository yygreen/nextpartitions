<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 332" width="780" height="332" role="img" aria-labelledby="t-material-section-stainless-steel d-material-section-stainless-steel" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-material-section-stainless-steel">Stainless steel partition door, edge view</title>
<desc id="d-material-section-stainless-steel">A stainless steel door cut through near its edge: two type 304 stainless steel face sheets, uncoated and shown with a textured finish, over a honeycomb core. The edge is a formed stainless molding that interlocks with the turned-in ends of both face sheets. 1 inch thick.</desc>
