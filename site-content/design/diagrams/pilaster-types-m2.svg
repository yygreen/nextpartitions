<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 132" width="360" height="132" role="img" aria-labelledby="t-pilaster-types-m2 d-pilaster-types-m2" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-pilaster-types-m2">Toilet partition pilaster types, plan view</title>
<desc id="d-pilaster-types-m2">Seen from above: 1, a wall pilaster beside the side wall, carrying the door hinge; 2, an alcove pilaster fixed to the end of a panel, carrying the latch of the door beside it; 3, a middle pilaster with a panel meeting it from behind, carrying the latch of one door and the hinge of the next. The pilasters are shown in orange.</desc>
