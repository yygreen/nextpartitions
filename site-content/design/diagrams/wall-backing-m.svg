<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 166" width="360" height="166" role="img" aria-labelledby="t-wall-backing-m d-wall-backing-m" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-wall-backing-m">Wall backing behind a toilet partition wall bracket</title>
<desc id="d-wall-backing-m">The wall cut through at a panel bracket, seen from above: the wall finish, solid backing behind it (in orange), and a bracket fixed with a screw into a plastic anchor in a 5/16-inch hole at least 2 inches deep at each ear. The panel sits in the bracket.</desc>
