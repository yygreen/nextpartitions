<title id="t-door-hand-m1">Door hand and swing of a toilet partition door, plan view</title>
<desc id="d-door-hand-m1">Four single compartments seen from above, from outside the stall at the bottom: A, right-hand inswing, and B, left-hand outswing, are both an RH door; C, left-hand inswing, and D, right-hand outswing, are both an LH door. The pilaster on the hinge side is shown in orange.</desc>
