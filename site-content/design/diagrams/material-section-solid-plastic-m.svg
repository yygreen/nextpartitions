<title id="t-material-section-solid-plastic-m">Solid plastic (HDPE) partition door, edge view</title>
<desc id="d-material-section-solid-plastic-m">A solid plastic (HDPE) door cut through near its edge: one homogeneous sheet of high-density polyethylene, with no separate core, faces or edge band, and the color running all the way through. 1 inch thick.</desc>
