<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 212" width="360" height="212" role="img" aria-labelledby="t-latch-keeper-m d-latch-keeper-m" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-latch-keeper-m">Bathroom stall latch and keeper</title>
<desc id="d-latch-keeper-m">Inside face of a stall door where it meets the pilaster. The latch is mounted on the door; its bolt slides into the keeper (strike) mounted on the pilaster. An indicator latch adds a visible occupied or vacant indicator.</desc>
<defs>
<pattern id="hatch-latch-keeper-m" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f2f0ec"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc7bc" stroke-width="1.5"/></pattern>
<marker id="tick-latch-keeper-m" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 8 L8 2" stroke="#7a6a5e" stroke-width="1.5"/></marker>
</defs>
