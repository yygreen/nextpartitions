<title id="t-mounting-overhead-braced-detail-headrail-m">Detail: headrail cross-section</title>
<desc id="d-mounting-overhead-braced-detail-headrail-m">The headrail in cross-section: an extruded anodized aluminum rail with a sloping top and a raised grip-resistant face edge, clamped over the top of the stile and fixed to each wall with a wall bracket.</desc>
