<title id="t-mounting-floor-to-ceiling-detail-ftc-floor">Detail: floor-to-ceiling pilaster foot</title>
<desc id="d-mounting-floor-to-ceiling-detail-ftc-floor">The pilaster foot of a floor-to-ceiling stile: a leveling device at the floor as on floor-anchored stiles, with wedge anchors at least 2 inches into 3-inch structural concrete and a 4-inch shoe. The next pilaster's foot shows beside it.</desc>
