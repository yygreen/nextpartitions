<marker id="tick-hinge-types-m" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 8 L8 2" stroke="#7a6a5e" stroke-width="1.5"/></marker>
</defs>
