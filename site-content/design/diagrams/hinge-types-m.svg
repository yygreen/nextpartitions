<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" role="img" aria-labelledby="t-hinge-types-m d-hinge-types-m" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-hinge-types-m">Bathroom stall hinge types</title>
<desc id="d-hinge-types-m">Three common partition hinges: a gravity (cam) hinge with a pin at the top and an adjustable cam at the bottom; a wrap-around hinge whose flanges wrap the pilaster and door edges, seen from above; and a continuous hinge running the full height of the door.</desc>
<defs>
