<title id="t-ada-ambulatory-stall-m">Ambulatory accessible toilet compartment, plan view</title>
<desc id="d-ada-ambulatory-stall-m">An ambulatory accessible compartment seen from above: 35 to 37 inches wide and 60 inches deep minimum, with the toilet centerline 17 to 19 inches from the side wall or partition. A side-wall grab bar 42 inches long minimum is on both sides, starting 12 inches maximum from the rear wall and reaching 54 inches minimum from it. The door gives a 32-inch minimum clear opening and swings out, clear of the minimum compartment area. The minimum area and the grab bars are shown in orange.</desc>
