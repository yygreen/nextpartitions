<title id="t-install-sequence-2">Toilet partition installation sequence, steps 5 to 7</title>
<desc id="d-install-sequence-2">Three small frames, each a plan seen from above over a front view of two stalls: 5, the headrail fixed across the pilaster tops and to both walls; 6, the doors hung; 7, hinges and latches set and the gaps checked. Each step is shown in orange.</desc>
