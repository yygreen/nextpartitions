 font-weight="500" fill="#7a6a5e" text-anchor="start">Seen from above.</text><text x="527.2" y="95.6" font-size="13" font-weight="500" fill="#7a6a5e" text-anchor="start">With a screen between</text><text x="527.2" y="113.6" font-size="13" font-weight="500" fill="#7a6a5e" text-anchor="start">urinals, each centerline</text><text x="527.2" y="131.6" font-size="13" font-weight="500" fill="#7a6a5e" text-anchor="start">needs 15&quot; min to the</text><text x="527.2" y="149.6" font-size="13" font-weight="500" fill="#7a6a5e" text-anchor="start">screen as well (2018</text><text x="527.2" y="167.6" font-size="13" font-weight="500" fill="#7a6a5e" text-anchor="start">IPC 405.3.1).</text><text x="8" y="314" font-size="11" fill="#7a6a5e">Schematic: shows the principle, not one manufacturer's product.</text>
