<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 318" width="390" height="318" role="img" aria-labelledby="t-urinal-spacing d-urinal-spacing" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-urinal-spacing">Urinal spacing with urinal screens, plan view</title>
<desc id="d-urinal-spacing">Seen from above: three wall-hung urinals along a wall, with a side wall on the left and urinal screens between them. The first urinal centerline is at least 15 inches from the side wall, urinal centerlines are at least 30 inches apart, and there is at least 21 inches of clear space in front of each urinal (International Plumbing Code 405.3.1).</desc>
<defs>
<pattern id="hatch-urinal-spacing" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f2f0ec"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cfc7bc" stroke-width="1.5"/></pattern>
<marker id="tick-urinal-spacing" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 8 L8 2" stroke="#7a6a5e" stroke-width="1.5"/></marker>
</defs>
<rect width="390" height="318" fill="#ffffff"/>
<rect x="20" y="36" width="335.6" height="16" fill="url(#hatch-urinal-spacing)" stroke="none" stroke-width="1.5"/><line x1="42" y1="52" x2="355.6" y2="52" stroke="#1c0e05" stroke-width="1.5"/><rect x="20" y="36" width="22" height="214" fill="url(#hatch-urinal-spacing)" stroke="none" stroke-width="1.5"/><line x1="42" y1="52" x2="42" y2="250" stroke="#1c0e05" stroke-width="1.5"/><path d="M351.6 32 l-5 12 l10 6 l-5 12" fill="none" stroke="#7a6a5e" stroke-width="1.5"/><path d="M61.2 52 v25.6 q0 19.200000000000003 28.8 19.200000000000003 q28.8 0 28.8 -19.200000000000003 v-25.6 z" fill="#fff" stroke="#1c0e05" stroke-width="1.5"/><path d="M72.4 58.4 v19.200000000000003 q0 11.520000000000001 17.6 11.520000000000001 q17.6 0 17.6 -11.520000000000001 v-19.200000000000003 z" fill="none" stroke="#1c0e05" stroke-width="1"/><path d="M157.2 52 v25.6 q0 19.200000000000003 28.8 19.200000000000003 q28.8 0 28.8 -19.200000000000003 v-25.6 z" fill="#fff" stroke="#1c0e05" stroke-width="1.5"/><path d="M168.4 58.4 v19.200000000000003 q0 11.520000000000001 17.6 11.520000000000001 q17.6 0 17.6 -11.520000000000001 v-19.200000000000003 z" fill="none" stroke="#1c0e05" stroke-width="1"/><path d="M253.20000000000002 52 v25.6 q0 19.200000000000003 28.8 19.200000000000003 q28.8 0 28.8 -19.200000000000003 v-25.6 z" fill="#fff" stroke="#1c0e05" stroke-width="1.5"/><path d="M264.4 58.4 v19.200000000000003 q0 11.520000000000001 17.6 11.520000000000001 q17.6 0 17.6 -11.520000000000001 v-19.200000000000003 z" fill="none" stroke="#1c0e05" stroke-width="1"/><rect x="135.5" y="52" width="5" height="57.6" fill="#ffffff" stroke="#1c0e05" stroke-width="1.5"/><rect x="231.5" y="52" width="5" height="57.6" fill="#ffffff" stroke="#1c0e05" stroke-width="1.5"/><line x1="90" y1="50" x2="90" y2="244" stroke="#fe7802" stroke-width="1.5" stroke-dasharray="10 3 2 3"/><line x1="186" y1="50" x2="186" y2="218" stroke="#fe7802" stroke-width="1.5" stroke-dasharray="10 3 2 3"/><line x1="282" y1="50" x2="282" y2="218" stroke="#fe7802" stroke-width="1.5" stroke-dasharray="10 3 2 3"/><line x1="198.8" y1="164" x2="351.6" y2="164" stroke="#7a6a5e" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="320.40000000000003" y1="96.80000000000001" x2="320.40000000000003" y2="164" stroke="#7a6a5e" stroke-width="1"/><line x1="315.40000000000003" y1="96.80000000000001" x2="325.40000000000003" y2="96.80000000000001" stroke="#7a6a5e" stroke-width="1"/><line x1="315.40000000000003" y1="164" x2="325.40000000000003" y2="164" stroke="#7a6a5e" stroke-width="1"/><text x="328.40000000000003" y="135.4" font-size="14" font-weight="600" fill="#7a6a5e" text-anchor="start">21&quot; min</text><text x="351.6" y="180" font-size="11" font-weight="500" fill="#7a6a5e" text-anchor="end">wall, fixture or door</text><line x1="42" y1="238" x2="90" y2="238" stroke="#fe7802" stroke-width="2.5"/><line x1="90" y1="232" x2="90" y2="244" stroke="#fe7802" stroke-width="2"/><text x="98" y="243" font-size="14" font-weight="700" fill="#1c0e05" text-anchor="start">15&quot; min to the side wall</text><line x1="90" y1="210" x2="186" y2="210" stroke="#fe7802" stroke-width="2.5"/><line x1="90" y1="204" x2="90" y2="216" stroke="#fe7802" stroke-width="2"/><line x1="186" y1="204" x2="186" y2="216" stroke="#fe7802" stroke-width="2"/><text x="138" y="201" font-size="14" font-weight="700" fill="#1c0e05" text-anchor="middle">30&quot; min</text><line x1="186" y1="210" x2="282" y2="210" stroke="#fe7802" stroke-width="2.5"/><line x1="186" y1="204" x2="186" y2="216" stroke="#fe7802" stroke-width="2"/><line x1="282" y1="204" x2="282" y2="216" stroke="#fe7802" stroke-width="2"/><text x="234" y="201" font-size="14" font-weight="700" fill="#1c0e05" text-anchor="middle">30&quot; min</text><text x="138" y="127.6" font-size="13" font-weight="500" fill="#7a6a5e" text-anchor="middle">screen</text><text x="20" y="272" font-size="11" font-weight="500" fill="#7a6a5e" text-anchor="start">With a screen between urinals, each centerline needs 15&quot; min</text><text x="20" y="287" font-size="11" font-weight="500" fill="#7a6a5e" text-anchor="start">to the screen as well (2018 IPC 405.3.1). Seen from above.</text><text x="8" y="310" font-size="11" fill="#7a6a5e">Schematic: shows the principle, not one manufacturer's product.</text>
