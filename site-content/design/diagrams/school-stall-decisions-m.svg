<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 222" width="360" height="222" role="img" aria-labelledby="t-school-stall-decisions-m d-school-stall-decisions-m" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-school-stall-decisions-m">Five things to decide for school bathroom stalls, front view</title>
<desc id="d-school-stall-decisions-m">Front view of a run of four overhead braced stalls with five things marked in orange: the surface of a door (the material), the headrail across the pilaster tops (the mounting style), a full-height hinge on a door edge (the hardware), the gaps at the edges of a door (privacy), and the clear space under a door (floor clearance in the accessible stall).</desc>
