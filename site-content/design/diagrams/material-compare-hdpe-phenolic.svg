<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 336" width="780" height="336" role="img" aria-labelledby="t-material-compare-hdpe-phenolic d-material-compare-hdpe-phenolic" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-material-compare-hdpe-phenolic">HDPE and phenolic partition doors compared, edge view</title>
<desc id="d-material-compare-hdpe-phenolic">Two partition doors cut through and seen edge on at the same scale: solid plastic (HDPE), 1 inch, one solid sheet with a rounded edge; phenolic (compact laminate), 3/4 inch, a layered kraft paper core with melamine faces and a chamfered edge.</desc>
