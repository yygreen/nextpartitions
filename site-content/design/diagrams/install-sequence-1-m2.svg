<title id="t-install-sequence-1-m2">Toilet partition installation sequence, steps 1 to 4</title>
<desc id="d-install-sequence-1-m2">Four small frames, each a plan seen from above over a front view of two stalls: 1, the layout marked on the floor and walls; 2, wall brackets fixed at the marks; 3, the wall pilasters stood in their shoes and leveled; 4, the panel set into its wall brackets on a 12-inch spacer, with the middle pilaster to follow. Each step is shown in orange.</desc>
