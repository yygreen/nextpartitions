<title id="t-mounting-floor-to-ceiling-detail-ftc-ceiling">Detail: floor-to-ceiling pilaster top</title>
<desc id="d-mounting-floor-to-ceiling-detail-ftc-ceiling">The top of a floor-to-ceiling stile: floor-to-ceiling stiles have a leveling device at each end, fixed to structural members in the ceiling (not supplied by the partition maker). The next stile is fixed the same way beside it.</desc>
