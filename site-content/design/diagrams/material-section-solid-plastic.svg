<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 334" width="390" height="334" role="img" aria-labelledby="t-material-section-solid-plastic d-material-section-solid-plastic" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-material-section-solid-plastic">Solid plastic (HDPE) partition door, edge view</title>
<desc id="d-material-section-solid-plastic">A solid plastic (HDPE) door cut through near its edge: one homogeneous sheet of high-density polyethylene, with no separate core, faces or edge band, and the color running all the way through. 1 inch thick (Scranton Products).</desc>
