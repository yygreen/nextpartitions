<title id="t-mounting-styles-compare">The four bathroom partition mounting styles side by side</title>
<desc id="d-mounting-styles-compare">Front views of overhead braced (headrail across the pilaster tops), floor mounted (pilasters anchored in the floor only), ceiling hung (pilasters hang from steel above the ceiling, floor clear) and floor to ceiling (pilasters anchored at floor and ceiling). The support system is shown in orange.</desc>
