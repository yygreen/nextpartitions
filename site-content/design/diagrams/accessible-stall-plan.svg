<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 391.6" width="780" height="391.6" role="img" aria-labelledby="t-accessible-stall-plan d-accessible-stall-plan" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title id="t-accessible-stall-plan">Wheelchair accessible toilet compartment, plan view</title>
<desc id="d-accessible-stall-plan">A wheelchair accessible compartment seen from above, drawn at the minimum size: 60 inches wide minimum, and 59 inches deep minimum with a floor-mounted toilet or 56 inches with a wall-hung toilet. The toilet centerline is 16 to 18 inches from the side wall. The door in the front partition opens out, gives a 32-inch minimum clear opening and sits within 4 inches of the side partition farthest from the toilet. Toe clearance runs 6 inches beyond the front partition and one side partition. The minimum compartment area, which the door may not swing into, is shown in orange.</desc>
